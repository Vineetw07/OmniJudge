[portal]
base_url = "http://localhost:8080"

[tiers]
claimed = ["T1", "T2"]
bonuses = ["normalization-proof", "threat-model", "api-first"]
pitch = """
OmniJudge is a self-hostable hackathon judging portal with three role-separated views: a public project gallery with community voting, a judge scoring portal with weighted rubric sliders, and an organizer command center with a live leaderboard and CSV export.

Security is enforced at the HTTP boundary — not the UI layer. Every route handler runs a three-layer check (401 session → 403 role → 403 IDOR) before any database query executes. Judges cannot read peer scores even via direct curl.

Score fairness uses Modified Z-Score (MAD method) instead of classical Z-score, which crashes with NaN when a judge awards every project the same score. The fixture's jdg_07 (Iva Petrova) does exactly this (identical 12.0 scores), alongside single-review judges (jdg_01, jdg_23) — our zero-variance and epsilon (< 1e-9) guards handle them cleanly. The full mathematical derivation of the 0.6745 constant is in JUDGING.md.

Additional integrity mechanisms: sealed results invariant (vote counts return null over the wire until the organizer unseals), self-vote defense via TeamMember relational check, atomic prisma.$transaction on every multi-table write, immutable AuditLog trail for all judging and community events, and 10-second sliding-window comment rate limiting backed by the database.
"""

[auth]
organizer   = "Cookie: session=org_seed_token_2026"
judge_a     = "Cookie: session=jdg_a_seed_token_2026"
judge_b     = "Cookie: session=jdg_b_seed_token_2026"
participant = "Cookie: session=prt_seed_token_2026"

[routes]
gallery      = "/projects"
submit       = "/api/projects"
judge_scores = "/api/judge/scores"
peer_scores  = "/api/judge/scores?judge=user_jdg_a_01"
csv_export   = "/api/export.csv"
